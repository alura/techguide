name: "Gestão de produtos digitais: Product Discovery"
logo: ""
short-description: "Product Discovery: outcomes x outputs, pesquisa com usuários, hipóteses e Jobs to be Done."
key-objectives:
  - "Diferencie outputs de outcomes e priorize resultados que gerem valor para usuários e negócio."
  - "Conduza pesquisas qualitativas e quantitativas para descobrir necessidades reais dos usuários."
  - "Estruture hipóteses e aplique métodos como os cinco porquês e Job to be Done para mapear jornadas."
  - "Priorize problemas e oportunidades usando frameworks como RICE e ICE."
  - "Converta evidências em discover reports e roadmaps alinhados à estratégia do produto."
  - "Aplique ferramentas de IA para apoiar validação, experimentação, análise de dados e documentação."
