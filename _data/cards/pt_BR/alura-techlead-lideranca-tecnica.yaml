short-description: "O papel do Tech Lead hoje: liderança por influência e alinhamento entre engenharia e negócio."
key-objectives:
  - "Compreenda o papel e as responsabilidades do techlead no contexto atual do mercado."
  - "Diferencie autoridade formal de liderança por influência e saiba quando aplicar cada abordagem."
