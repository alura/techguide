short-description: "Transformar pesquisa UX em dashboards e apresentações que levam stakeholders a decidir."
key-objectives:
  - "Converta dados de pesquisa tabulados em visualizações acionáveis direcionadas a stakeholders."
  - "Aplique técnicas de UX research para priorizar e selecionar o que realmente importa na apresentação."
  - "Crie dashboards interativos em HTML com apoio de IA para acompanhamento de métricas."
  - "Elabore narrativas e slides executivos adaptados a diferentes audiências usando matrizes de impacto e mapeamento de público."
  - "Incorpore insights gerados por IA para enriquecer recomendações de priorização e tomadas de decisão."
  - "Itere e refine dashboards com base em feedbacks e métricas de acompanhamento para melhorar a comunicação dos dados."
