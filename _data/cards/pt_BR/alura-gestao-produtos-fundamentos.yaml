name: "Gestão de produtos: fundamentos para product builders"
logo: ""
short-description: "Fundamentos de produto para quem constrói: enquadrar problemas, ouvir usuários e formular propostas de valor."
key-objectives:
  - "Enquadre problemas de forma estruturada, considerando contexto, atores, necessidades, barreiras e consequências."
  - "Conduza pesquisas e conversas com usuários para identificar dores reais e priorizar oportunidades."
  - "Formule e refine propostas de valor claras que comuniquem a transformação oferecida pelo produto."
  - "Fique por dentro do que são personas e a metodologia Jobs To Be Done para orientar a definição e priorização de funcionalidades."
  - "Saiba como projetar MVPs para testar hipóteses rapidamente e coletar feedback real."
  - "Entenda sobre métricas relevantes (ativação, retenção e North Star) para guiar decisões e iterações."
