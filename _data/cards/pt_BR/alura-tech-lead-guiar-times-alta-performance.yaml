short-description: "Diagnóstico do time, gaps de conhecimento e práticas para alta performance."
key-objectives:
  - "Entenda o papel do Tech Lead e priorize impacto coletivo sobre excelência individual."
  - "Realize diagnóstico do time e identifique gaps de conhecimento e níveis de criticidade."
  - "Implemente planos de desenvolvimento individual (PDI) alinhados a metas de evolução técnica."
  - "Delegue com segurança aplicando critérios claros para distribuir autonomia e reduzir gargalos."
  - "Promova rituais de feedback e conduza conversas difíceis com foco no desenvolvimento."
  - "Utilize a IA como co-piloto para gerar, revisar e analisar entregas, mantendo supervisão humana em pontos críticos."
  - "Estabeleça práticas ágeis e governança técnica que sustentem uma cultura de aprendizagem e alta performance."
