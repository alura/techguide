name: "Tech Lead: alinhar engenharia ao ciclo de vida do produto"
logo: ""
short-description: "Engenharia alinhada ao produto: discovery, roadmap técnico e negociação com stakeholders."
key-objectives:
  - "Atue no discovery para identificar restrições técnicas e reduzir custos de mudança"
  - "Construa roadmaps técnicos alinhados ao negócio e defensáveis perante stakeholders"
  - "Equilibre trade-offs entre valor, qualidade e custo para priorizar entregas"
  - "Implemente práticas de evolução contínua e use feature flags para gerenciar lançamentos"
  - "Utilize métricas como lead time, MTTR, churn e retenção para embasar decisões técnicas"
  - "Facilite o planejamento colaborativo entre Tech Leads, Product Managers e Designers"
  - "Aplique dados e IA para acelerar prototipagem e validar alternativas"
