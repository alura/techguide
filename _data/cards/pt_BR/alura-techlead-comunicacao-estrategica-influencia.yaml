name: "Tech Lead: comunicação estratégica e influência"
logo: ""
short-description: "Comunicação estratégica do Tech Lead: mensagens que levam a decisão e influenciam."
key-objectives:
  - "Diferencie comunicação estratégica e operacional para priorizar o que e como comunicar conforme o público."
  - "Estruture mensagens com contexto, problema, riscos e recomendações para facilitar a tomada de decisão."
  - "Use dados e evidências para justificar decisões técnicas e reduzir riscos de retrabalho."
  - "Influencie sem autoridade formal aplicando técnicas de persuasão e negociação entre áreas."
  - "Gerencie conflitos técnicos de forma produtiva, transformando desacordos em decisões alinhadas ao produto."
  - "Implemente rituais de comunicação e feedback (one-on-ones, post-mortems e playbooks) para manter o alinhamento em equipes distribuídas."
