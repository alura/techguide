short-description: "Claude Cowork conectado a Calendar e ClickUp via MCP para automatizar a gestão de projetos."
key-objectives:
  - "Compare APIs REST e o protocolo MCP para entender como agentes de IA acessam outros sistemas."
  - "Conecte Google Calendar e ClickUp ao Claude Cowork por MCP, com permissões definidas por ação."
