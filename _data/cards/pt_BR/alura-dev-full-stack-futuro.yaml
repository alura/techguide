short-description: "O que é ser Dev Full Stack hoje e como usar a IA como parceira, sem pular etapas."
key-objectives:
  - "Entenda a relação entre desenvolvimento de software e modelos de IA e avalie quando delegar tarefas à IA."
  - "Explique como mapear requisitos de negócio e traduzir vocabulário técnico em especificações para LLMs."
  - "Projete fluxos de integração entre aplicações e serviços de IA considerando infraestrutura, segurança e observabilidade."
  - "Aplique técnicas de engenharia de prompts para obter respostas mais relevantes e controladas de IAs generativas."
  - "Utilize IAs generativas para acelerar tarefas repetitivas e produzir artefatos úteis para o portfólio."
  - "Implemente práticas de revisão, manutenção e colaboração multidisciplinar para garantir qualidade do código gerado."
