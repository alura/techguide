short-description: "Chatbots com RAG no n8n: vetorização de documentos, vector stores e agentes que escolhem suas ferramentas."
key-objectives:
  - "Desenvolva chatbots avançados integrando n8n, Slack e modelos de IA como OpenAI e Gemini."
  - "Domine a técnica de RAG para criar agentes que consultam bases de dados proprietárias em tempo real."
  - "Converta documentos em inteligência utilizando vetorização de textos e Vector Stores."
