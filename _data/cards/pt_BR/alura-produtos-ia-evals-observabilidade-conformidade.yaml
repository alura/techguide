key-objectives:
  - "Lance um MVP de produto de IA e conduza iterações orientadas pelo feedback de usuários."
  - "Desenvolva evals estruturados para avaliar a performance de modelos de linguagem em critérios relevantes."
  - "Implemente métricas e mecanismos de observabilidade para monitorar interações e detectar anomalias em tempo real."
  - "Mapeie e gerencie riscos, definindo guardrails e critérios de qualidade alinhados à LGPD."
  - "Estruture processos de governança e conformidade para proteger usuários e dados sensíveis."
  - "Estabeleça integrações entre lógica automatizada e supervisão humana para decisões seguras."
  - "Elabore relatórios de diagnóstico e planos de ação para identificar e corrigir falhas do produto."
