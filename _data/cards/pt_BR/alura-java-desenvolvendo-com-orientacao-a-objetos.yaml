short-description: "Orientação a objetos com Java modelando um domínio de e-commerce."
key-objectives:
  - "Entenda os pilares da orientação a objetos e aplique-os na modelagem de classes de domínio."
  - "Modele e relacione entidades do domínio de e‑commerce usando herança e composição."
  - "Implemente tratamento de exceções para tornar a aplicação mais resiliente e previsível."
  - "Utilize coleções, generics, enums e records para organizar e manipular dados de forma robusta."
  - "Aplique streams e expressões lambda para processar coleções de maneira declarativa e eficiente."
  - "Refatore e organize o código adotando boas práticas e separação de responsabilidades."
