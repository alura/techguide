name: "Tech Lead: agilidade, fluxo e previsibilidade"
logo: ""
short-description: "Fluxo e previsibilidade: limitar WIP, achar gargalos e dar previsões confiáveis."
key-objectives:
  - "Entenda a diferença entre o papel do Tech Lead e o de um desenvolvedor especialista."
  - "Organize e otimize o fluxo do time, limitando Work in Progress e identificando gargalos invisíveis."
  - "Meça e interprete métricas essenciais (Lead Time, Cycle Time e métricas DORA) para aumentar a previsibilidade."
  - "Estruture práticas modernas de CI/CD e governance de releases para reduzir riscos e aumentar frequência de entrega."
  - "Aplique princípios de DevOps e SRE, definindo SLAs, SLOs e orçamentos de erro para gerir confiabilidade."
  - "Utilize simulações probabilísticas, como Monte Carlo, para planejar entregas e avaliar riscos."
  - "Promova uma cultura blameless de incident response, coordene post-mortems e direcione automações para remover bloqueios."
