short-description: "Diferença entre assistentes e agentes, design de prompts e workflows multiagentes para ganhar produtividade."
key-objectives:
  - "Diferencie assistentes e agentes inteligentes e identifique casos de uso adequados para cada um."
  - "Planeje comportamentos de agentes usando matrizes e fluxos condicionais para resolver problemas complexos."
  - "Projete prompts e templates que personalizem respostas com variáveis contextuais."
  - "Estruture workflows e arquiteturas multiagentes para distribuir tarefas e combinar precisão e criatividade."
  - "Integre assistentes com ferramentas auxiliares (busca de arquivos, Code Interpreter) para análise e automação."
  - "Implemente estratégias de supervisão humana e avaliação ética para reduzir vieses e melhorar resultados."
  - "Desenvolva assistentes aplicados a marketing e resumos de reuniões usando templates e fluxos condicionais."
