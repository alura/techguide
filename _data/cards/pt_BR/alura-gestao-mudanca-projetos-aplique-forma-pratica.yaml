name: "Gestão da mudança em projetos: aplique de forma prática"
logo: ""
short-description: "Gestão da mudança para que novas tecnologias e processos sejam de fato adotados."
key-objectives:
  - "Entenda como gerir mudanças em projetos para adoção de novas tecnologias, ferramentas ou processos, de forma sustentável"
  - "Aplique práticas de gestão da mudança para projetos, garantindo maior engajamento e adesão no longo prazo"
  - "Realize a análise de prontidão para avaliar o nível de preparo da equipe ou empresa para implementar mudanças"
  - "Mapeie o estado atual e o estado desejado, utilizando um mapa da jornada do processo para planejar estratégias de curto, médio e longo prazo"
  - "Desenvolva metas SMART e construa um plano de ações com o método 5W2H aplicado à gestão da mudança"
  - "Engaje diferentes perfis com estratégias como storytelling, criando narrativas que gerem empatia"
  - "Lide com resistências, execute e monitore mudanças com planos de melhoria contínua, garantindo aprendizado durante o processo"
