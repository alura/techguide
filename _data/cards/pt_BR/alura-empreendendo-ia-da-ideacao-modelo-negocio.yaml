name: "Empreendendo com IA: da ideação ao modelo de negócio"
logo: ""
short-description: "Da ideação ao modelo de negócio com IA: co-design, validação de hipóteses e priorização."
key-objectives:
  - "Aplique metodologias colaborativas como co-design e o modelo do duplo diamante para compreender e definir as demandas dos usuários."
  - "Transforme dados não estruturados em insights valiosos por meio de técnicas de ciência de dados e machine learning."
  - "Valide hipóteses e reduza riscos utilizando ferramentas de priorização como a matriz de impacto e esforço e a votação com Fibonacci."
  - "Implemente soluções de visão computacional e deep learning para análise e interpretação de dados complexos."
  - "Integre soluções SaaS para garantir escalabilidade e operacionalização de produtos e serviços baseados em IA."
  - "Envolva stakeholders em todas as etapas e estruture modelos de negócio inovadores com o Business Model Canvas."
