short-description: "Copilot integrando Word, Excel e PowerPoint para gerar análises, relatórios e apresentações."
key-objectives:
  - "Entenda como o Copilot conecta Word, Excel e PowerPoint para automatizar a criação de conteúdos e manter contexto entre arquivos."
  - "Converta dados do Excel em análises e gráficos acionáveis para apoiar decisões executivas."
  - "Gere relatórios profissionais no Word a partir de planilhas, preservando referências e contexto armazenado no OneDrive."
  - "Crie apresentações executivas no PowerPoint com sugestões visuais do designer e estrutura baseada em insights extraídos dos dados."
  - "Configure agentes personalizados com o Agent Builder para automatizar tarefas recorrentes, incluindo a geração de código VBA quando necessário."
  - "Desenvolva prompts e estratégias de interação para obter respostas precisas e contextualizadas do Copilot no dia a dia."
