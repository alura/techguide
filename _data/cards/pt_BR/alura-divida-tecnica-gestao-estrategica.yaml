name: "Dívida Técnica: gestão estratégica entre velocidade e qualidade"
logo: ""
short-description: "Identificar, medir e priorizar dívida técnica equilibrando velocidade e qualidade."
key-objectives:
  - "Identifique e classifique dívidas técnicas considerando impacto em arquitetura, código, testes e infraestrutura."
  - "Meça a dívida técnica usando métricas relevantes, como complexidade ciclomática e cobertura de testes."
  - "Priorize ações de mitigação com base em custo, risco e valor para o negócio."
  - "Implemente estratégias de refatoração incremental e fortaleça práticas de code review."
  - "Estabeleça práticas de CI/CD e testes automatizados para reduzir acúmulo de dívida."
  - "Comunique e justifique decisões técnicas para stakeholders, alinhando velocidade e sustentabilidade do sistema."
