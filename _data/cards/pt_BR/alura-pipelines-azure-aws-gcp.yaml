name: "Pipelines de IA em Cloud: Azure, AWS e GCP"
logo: ""
short-description: "Pipelines de ML e IA generativa em nuvem com Vertex AI, AWS e Azure."
key-objectives:
  - "Configure ambientes de IA em plataformas de nuvem como Google Cloud, AWS e Azure, compreendendo suas ofertas e vantagens."
  - "Implemente pipelines automatizados de Machine Learning na VertexAI com uso do KFP e da SDK do Python."
  - "Treine e avalie modelos de ML com AutoML e explore a integração com BigQuery e Feature Store."
  - "Aprofunde-se em Foundation Models e Large Language Models (LLMs) aplicando prompt engineering, RAG e fine-tuning."
  - "Desenvolva e implante agentes inteligentes com o AgentBuilder e o Agent Development Kit (ADK)."
  - "Integre soluções baseadas em IA com Cloud Run, APIs externas e serviços SaaS."
  - "Compreenda como monitorar custos, gerenciar recursos e aproveitar créditos de forma eficiente em ambientes de cloud."
  - "Combine práticas de escalabilidade, governança e segurança para criar soluções de IA confiáveis e sustentáveis."
