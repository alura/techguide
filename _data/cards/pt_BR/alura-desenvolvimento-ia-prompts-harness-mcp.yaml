short-description: "Desenvolvimento assistido por IA: prompts, contexto, harness e MCP na prática."
key-objectives:
  - "Construa prompts, metaprompts e estratégias de role prompting para orientar LLMs a produzir respostas consistentes."
  - "Refine artefatos de contexto e gerencie a janela de contexto para manter coerência em interações complexas."
  - "Implemente harnesses que verifiquem, validem e guiem ações dos modelos durante fluxos assistidos por IA."
  - "Integre MCP Server e MCP Client com mecanismos de autenticação para conectar LLMs a bancos de dados e repositórios externos."
  - "Crie Skills e Hooks para automatizar gatilhos, componentes reutilizáveis e workflows em aplicações assistidas por IA."
  - "Aplique práticas de desenvolvimento assistido por IA, incluindo revisão de código, testes automatizados e TDD para garantir qualidade."
